<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StratumWeb — Admin Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0b1120; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card { background: #1a2332; padding: 48px; border-radius: 24px; width: 100%; max-width: 400px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
  h1 { color: #d4af37; font-size: 24px; text-align: center; margin-bottom: 8px; }
  p { color: #94a3b8; text-align: center; margin-bottom: 32px; font-size: 14px; }
  input {
    width: 100%; padding: 16px; border-radius: 12px; border: 1px solid #2d3a4a; background: #0f172a;
    color: #f1f5f9; font-size: 16px; outline: none; transition: border 0.2s;
  }
  input:focus { border-color: #d4af37; }
  button {
    width: 100%; padding: 16px; border-radius: 12px; border: none; background: #d4af37;
    color: #0b1120; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 20px; transition: opacity 0.2s;
  }
  button:hover { opacity: 0.9; }
  .error { background: #7f1d1d; color: #fca5a5; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 16px; font-size: 14px; }
</style>
</head>
<body>
<div class="card">
  <h1>✦ StratumWeb</h1>
  <p>Admin dashboard — enter password</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST" action="/admin/login">
    <input type="password" name="password" placeholder="Admin password" required autofocus>
    <button type="submit">LOG IN</button>
  </form>
</div>
</body>
</html>
